name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install foundry
        run: |
          V=$(curl -s https://api.github.com/repos/foundry-rs/foundry/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "foundry version: $V"
          curl -sL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V#v}_linux_amd64.tar.gz" -o /tmp/f.tgz
          sudo tar -xzf /tmp/f.tgz -C /usr/local/bin
          forge --version
      - name: contracts build+test
        working-directory: contracts
        run: forge build --sizes && forge test -vvv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web build
        working-directory: web
        run: npm ci && npx tsc --noEmit && npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: agent install
        working-directory: agent
        run: npm ci && node -e "import('ethers').then(()=>process.exit(0))"
