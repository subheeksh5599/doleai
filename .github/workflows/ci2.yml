name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install foundry
        run: |
          curl -L https://foundry.paradigm.xyz -o /tmp/fi.sh
          bash /tmp/fi.sh
          foundryup --version stable
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: forge check
        working-directory: contracts
        run: forge --version
      - name: contracts build+test
        working-directory: contracts
        run: forge build --sizes && forge test -vvv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web build
        working-directory: web
        run: npm ci && npx tsc --noEmit && npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: agent install
        working-directory: agent
        run: npm ci && node -e "import('ethers').then(()=>process.exit(0))"
