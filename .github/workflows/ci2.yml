name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install foundry
        run: |
          curl -L https://foundry.paradigm.xyz -o /tmp/fi.sh
          bash /tmp/fi.sh
          # locate the foundryup binary wherever the installer put it
          FUP=$(ls "$HOME/.foundry/bin/foundryup" 2>/dev/null || ls "$HOME/bin/foundryup" 2>/dev/null || find "$HOME" -maxdepth 3 -name foundryup -type f 2>/dev/null | head -1)
          echo "foundryup at: $FUP"
          export PATH="$(dirname "$FUP"):$PATH"
          foundryup --version stable
          echo "$(dirname "$FUP")" >> "$GITHUB_PATH"
      - name: forge check
        working-directory: contracts
        run: forge --version
      - name: contracts build+test
        working-directory: contracts
        run: forge build --sizes && forge test -vvv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web build
        working-directory: web
        run: npm ci && npx tsc --noEmit && npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: agent install
        working-directory: agent
        run: npm ci && node -e "import('ethers').then(()=>process.exit(0))"
