name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        run: |
          mkdir -p "$HOME/.foundry"
          curl -L https://foundry.paradigm.xyz -o /tmp/foundry-install.sh
          bash /tmp/foundry-install.sh
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup --version stable
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: Forge build
        working-directory: contracts
        run: forge build --sizes
      - name: Forge format check
        working-directory: contracts
        run: forge fmt --check
      - name: Forge test
        working-directory: contracts
        run: forge test -vvv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_RPC_URL: https://rpc.botchain.ai
          NEXT_PUBLIC_POOL_ADDRESS: 0x688D6d4f3769f219a40009108bC7c2ca4177c6fD
          NEXT_PUBLIC_PAYMENT_TOKEN: 0xD5452816194a3784dBa983426cCe7c122F4abd30
          NEXT_PUBLIC_AGENT_ADDRESS: 0x1F6AB228525928248db1F9Bb243B844B6e1f38f7
          NEXT_PUBLIC_EXPLORER_API: https://scan.botchain.ai/api
          NEXT_PUBLIC_EXPLORER_BASE: https://scan.botchain.ai
          NEXT_PUBLIC_CHAIN_ID: "677"

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install
        working-directory: agent
        run: npm ci
      - name: Deps link
        working-directory: agent
        run: node -e "import('ethers').then(()=>{console.log('ethers ok');process.exit(0)})"
